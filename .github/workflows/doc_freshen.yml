name: Documentation Auto-Freshen

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  auto-freshen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          python3 -m pip install --upgrade pip

      - name: Configure git
        run: |
          git config user.name "Hydra Doc Bot"
          git config user.email "noreply@hydra-project.org"

      - name: Rebuild doc metadata
        run: |
          python3 scripts/doc_touch.py --scan
          python3 scripts/doc_touch.py --rebuild-metadata

      - name: Check for stale docs
        id: check
        run: |
          if python3 scripts/doc_touch.py --check; then
            echo "STALE=false" >> $GITHUB_OUTPUT
          else
            echo "STALE=true" >> $GITHUB_OUTPUT
          fi

      - name: Auto-freshen Tier 1 docs
        if: steps.check.outputs.STALE == 'true'
        run: |
          python3 scripts/doc_freshen.py --auto

      - name: Generate AI update prompts for Tier 2
        if: steps.check.outputs.STALE == 'true'
        run: |
          python3 scripts/doc_ai_freshen.py --generate-prompts --confidence 0.7

      - name: Check for changes
        id: git_status
        if: steps.check.outputs.STALE == 'true'
        run: |
          if git diff --quiet; then
            echo "CHANGES=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit auto-freshened docs
        if: steps.git_status.outputs.CHANGES == 'true'
        run: |
          git add docs/
          git commit -m "Auto-freshen stale documentation (Tier 1)

          Automatically updated by doc_freshen.py:
          - Update Last Updated dates
          - Fix broken cross-references
          - Sync trivial content changes

          🤖 Generated by Hydra Doc Bot
          "

      - name: Create Pull Request
        if: steps.git_status.outputs.CHANGES == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-freshen stale documentation"
          branch: auto-freshen-docs
          title: "Auto-freshen stale documentation"
          body: |
            ## Auto-Freshened Documentation

            This PR was automatically generated by the doc freshening system.

            ### Changes Made
            - ✅ Auto-freshened Tier 1 docs (dates, broken refs)
            - 📝 Generated AI update prompts for Tier 2 docs (see artifacts)

            ### What to Review
            - Verify date updates are correct
            - Check that cross-reference fixes are valid
            - Review AI prompts in `docs/ai_freshening/` for manual application

            ### Touch System Reports
            Run `python3 scripts/doc_touch.py --check` locally to see full staleness analysis.

            🤖 Auto-generated by Hydra Doc Bot
          labels: documentation, automated

      - name: Upload AI prompts artifact
        if: steps.check.outputs.STALE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ai-update-prompts
          path: docs/ai_freshening/
          if-no-files-found: ignore
