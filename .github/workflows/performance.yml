name: Performance Regression Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache sim build
        uses: actions/cache@v4
        with:
          path: |
            sim/obj_dir
            sim/sim_voxel
          key: ${{ runner.os }}-perf-sim-${{ hashFiles('sim/**','rtl/**','Makefile') }}
          restore-keys: |
            ${{ runner.os }}-perf-sim-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make libsdl2-dev libsdl2-ttf-dev python3

      - name: Build sim if not cached
        run: |
          if [ ! -f sim/sim_voxel ]; then
            cd sim
            make -j$(nproc)
          fi

      - name: Run performance benchmark
        run: |
          chmod +x scripts/render_benchmark.sh
          ./scripts/render_benchmark.sh

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'push'
        with:
          name: Render Performance Benchmark
          tool: 'custom'
          output-file-path: out/render_pipeline_baseline.csv
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '200%'
          fail-on-alert: false

      - name: AI Performance Analysis
        if: always()
        run: |
          python3 scripts/ai_performance_analysis.py --benchmark out/render_pipeline_baseline.csv --output ai_perf_analysis.md

      - name: Store Performance Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/ai_performance_baseline.py --store --data out/render_pipeline_baseline.csv

      - name: AI Performance Regression Detection
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/ai_performance_baseline.py --compare --data out/render_pipeline_baseline.csv --output perf_regression.md

      - name: Post AI Performance Insights
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f ai_perf_analysis.md ]; then
            python3 scripts/post_ai_review.py --pr ${{ github.event.pull_request.number }} --suggestions ai_perf_analysis.md
          fi
          if [ -f perf_regression.md ]; then
            python3 scripts/post_ai_review.py --pr ${{ github.event.pull_request.number }} --suggestions perf_regression.md
          fi

      - name: Upload AI Performance Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-performance-analysis
          path: |
            ai_perf_analysis.md
            perf_regression.md
          retention-days: 30