name: Repo Hygiene

on:
  push:
    branches: [ main, 'sim/**' ]
  pull_request:
    branches: [ main ]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run hygiene checks
        run: |
          chmod +x scripts/check_hygiene.sh
          ./scripts/check_hygiene.sh
