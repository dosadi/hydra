name: Hydra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator libsdl2-dev libsdl2-ttf-dev ninja-build cmake g++ python3

      - name: Build host tools (CMake)
        run: |
          cmake --preset linux-default
          cmake --build build/linux

      - name: Build RTL sim and run frame test
        run: |
          cd sim
          make
          make test_frame
