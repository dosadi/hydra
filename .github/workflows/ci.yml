  doc-build-touch:
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Scan documentation dependencies
        run: |
          python3 scripts/doc_touch.py --scan
          python3 scripts/doc_touch.py --rebuild-metadata

      - name: Check doc freshness
        id: doc_check
        run: |
          python3 scripts/doc_touch.py --check > doc_check.txt || echo "STALE_DOCS=true" >> $GITHUB_OUTPUT
          cat doc_check.txt

      - name: Analyze stale docs
        if: steps.doc_check.outputs.STALE_DOCS == 'true'
        run: |
          python3 scripts/doc_freshen.py --analyze > doc_analysis.txt
          cat doc_analysis.txt

      - name: Auto-freshen Tier 1 docs
        if: steps.doc_check.outputs.STALE_DOCS == 'true'
        run: |
          python3 scripts/doc_freshen.py --auto --dry-run > doc_freshen_plan.txt
          cat doc_freshen_plan.txt
          echo "Would auto-freshen Tier 1 docs in production mode"

      - name: Scan build tree dependencies
        run: |
          python3 scripts/build_touch.py --scan

      - name: Check build artifact freshness
        id: build_check
        run: |
          python3 scripts/build_touch.py --check > build_check.txt || echo "STALE_BUILDS=true" >> $GITHUB_OUTPUT
          cat build_check.txt || echo "All build artifacts up to date"

      - name: Generate touch system report
        if: always()
        run: |
          mkdir -p artifacts
          echo "# Touch System CI Report" > artifacts/touch_report.md
          echo "" >> artifacts/touch_report.md
          echo "## Documentation Status" >> artifacts/touch_report.md
          cat doc_check.txt >> artifacts/touch_report.md 2>/dev/null || echo "No stale docs" >> artifacts/touch_report.md
          echo "" >> artifacts/touch_report.md
          echo "## Build Artifact Status" >> artifacts/touch_report.md
          cat build_check.txt >> artifacts/touch_report.md 2>/dev/null || echo "All artifacts fresh" >> artifacts/touch_report.md

      - name: Upload touch system report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: touch-system-report
          path: artifacts/touch_report.md

      - name: Fail if critical docs are stale
        if: steps.doc_check.outputs.STALE_DOCS == 'true'
        run: |
          echo "::warning::Stale documentation detected. Run 'python3 scripts/doc_freshen.py --auto' to fix."
          # Don't fail the build yet - just warn
          # Uncomment below to enforce freshness:
          # exit 1

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 curl

      - name: Fetch Hydra QEMU guest image (optional)
        env:
          HYDRA_QEMU_GUEST_URL: ${{ secrets.HYDRA_QEMU_GUEST_URL }}
        run: |
          if [ -n "${HYDRA_QEMU_GUEST_URL:-}" ]; then
            mkdir -p artifacts
            echo "[qemu-smoke] Downloading guest image from ${HYDRA_QEMU_GUEST_URL}"
            curl -L "${HYDRA_QEMU_GUEST_URL}" -o artifacts/hydra-guest.qcow2
            echo "HYDRA_QEMU_GUEST_IMG=$PWD/artifacts/hydra-guest.qcow2" >> $GITHUB_ENV
          else
            echo "[qemu-smoke] HYDRA_QEMU_GUEST_URL not set; QEMU smoke will skip unless HYDRA_QEMU_GUEST_IMG is provided via env"
          fi

      - name: Run QEMU Hydra PCI stub smoke (if configured)
        run: |
          chmod +x sim/tests/qemu_stub/qemu_hydra_smoke.sh
          sim/tests/qemu_stub/qemu_hydra_smoke.sh

  cocotb:
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v6

      - name: Install cocotb + Icarus
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install cocotb

      - name: Run cocotb smoke test (voxel_sim_harness)
        run: |
          cd sim/tests/cocotb_hydra
          make SIM=icarus

  freebsd-kmod:
    runs-on: ubuntu-latest
    needs: linux
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Build FreeBSD kmod stub (best-effort via vmactions/freebsd-vm)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '13.2'
          usesh: true
          prepare: |
            pkg install -y git gmake
          run: |
            cd $GITHUB_WORKSPACE
            gmake -C drivers/bsd -f Makefile.kmod

  ai-dashboard:
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v6

      - name: Generate tracker metadata
        run: |
          python3 scripts/todo_metadata.py

      - name: Build AI health dashboard
        run: |
          python3 scripts/ai_health_dashboard.py --output out/ai_health_dashboard.txt

      - name: Upload AI dashboard artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-health-dashboard
          path: out/ai_health_dashboard.txt

      - name: Post AI dashboard summary to workflow
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const core = require("@actions/core");
            const summary = fs.readFileSync("out/ai_health_dashboard.txt", "utf8");
            core.summary.addRaw("### AI Health Dashboard\n");
            core.summary.addRaw(summary);
            await core.summary.write();
