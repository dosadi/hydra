name: CI

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast feedback: lint and basic checks
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 python3-pip

      - name: Run lint checks
        run: |
          make lint

      - name: Check required files
        run: |
          make files

      - name: Check TODO uniqueness
        run: |
          make todo-unique

      - name: Check license headers
        run: |
          make license-check

  # Build and test across multiple compilers
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache sim build
        uses: actions/cache@v4
        with:
          path: |
            sim/obj_dir
            sim/build
            ~/.cache/verilator
          key: ${{ runner.os }}-sim-${{ matrix.compiler }}-${{ hashFiles('sim/**','rtl/**','Makefile') }}
          restore-keys: |
            ${{ runner.os }}-sim-${{ matrix.compiler }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator ${{ matrix.cc }} ${{ matrix.cxx }} make libsdl2-dev libsdl2-ttf-dev python3 python3-pip iverilog

      - name: Show versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          verilator --version
          iverilog -V || echo "iverilog version check failed"

      - name: Build sim
        run: |
          cd sim
          make -j$(nproc)

      - name: Run frame regression test
        id: frame_test
        run: |
          cd sim
          HYDRA_WORLD_SEED=12345 HYDRA_CAM_POS="0,0,0" HYDRA_CAM_ANG="0,0" make test_frame

      - name: Upload frame test artifacts on failure
        if: failure() && steps.frame_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frame-test-failure-${{ matrix.compiler }}
          path: |
            sim/build/frame_test.ppm
            sim/build/frame_diff.log
          retention-days: 30

      - name: Run pixel96 unit test
        run: |
          make pixel-test

      - name: Build SDK tools
        run: |
          ./scripts/setup_sdk.sh || echo "SDK build had warnings (may be expected)"

      - name: Run quick benchmark
        run: |
          make bench

  # RTL testbenches
  rtl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator make python3

      - name: Run RTL testbenches
        run: |
          ./sim/tests/run_rtl_tests.sh

  # Documentation checks
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, build-test, rtl-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Run docs lint
        run: |
          make docs

      - name: Check documentation freshness
        run: |
          python3 scripts/doc_touch.py --check || echo "Documentation freshness check failed - may need updates"

  # Comprehensive automation test
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, build-test, rtl-tests, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make libsdl2-dev libsdl2-ttf-dev python3 python3-pip shellcheck

      - name: Run priority sector automation
        run: |
          ./scripts/automate_priority.sh --skip-bench  # Skip bench for faster CI
