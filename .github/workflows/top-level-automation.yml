name: Top-Level Automation

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Automation mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            verilator \
            libsdl2-dev \
            libsdl2-ttf-dev \
            python3 \
            python3-pip \
            shellcheck \
            iverilog \
            clang-format \
            codespell

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Determine automation mode
        id: mode
        run: |
          if [[ "${{ github.event.inputs.mode }}" == "full" ]]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=quick" >> $GITHUB_OUTPUT
          fi

      - name: Run top-level automation
        run: |
          ./scripts/automate_top_level.sh ${{ steps.mode.outputs.mode }}

      - name: Generate automation report
        if: always()
        run: |
          echo "# Top-Level Automation Report" > automation_report.md
          echo "" >> automation_report.md
          echo "**Date:** $(date)" >> automation_report.md
          echo "**Mode:** ${{ steps.mode.outputs.mode }}" >> automation_report.md
          echo "**Commit:** ${{ github.sha }}" >> automation_report.md
          echo "**Status:** $([[ $? -eq 0 ]] && echo "✅ Passed" || echo "❌ Failed")" >> automation_report.md
          echo "" >> automation_report.md
          echo "## Summary" >> automation_report.md
          echo "- Environment validation" >> automation_report.md
          echo "- Code quality checks" >> automation_report.md
          echo "- Build and test execution" >> automation_report.md
          echo "- Priority sector automation" >> automation_report.md
          echo "- Touch system checks" >> automation_report.md
          echo "- Agent coordination" >> automation_report.md

      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report-${{ steps.mode.outputs.mode }}
          path: automation_report.md

      - name: Notify on failure
        if: failure()
        run: |
          echo "Top-level automation failed. Check the logs and artifacts for details."