name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make libsdl2-dev libsdl2-ttf-dev python3 python3-pip lcov

      - name: Build sim with coverage
        run: |
          cd sim
          make clean
          make COVERAGE=1 -j$(nproc)

      - name: Run tests with coverage
        run: |
          cd sim
          # Run frame test
          make test_frame
          # Run pixel test
          cd ..
          make pixel-test

      - name: Generate coverage report
        run: |
          cd sim
          # Generate lcov info
          lcov --capture --directory obj_dir --output-file coverage.info
          # Filter out system headers and third-party code
          lcov --remove coverage.info '/usr/*' '*/third_party/*' --output-file coverage.filtered.info
          # Generate HTML report
          genhtml coverage.filtered.info --output-directory coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./sim/coverage.filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: sim/coverage-report/