name: Sim Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
      - 'update/**'

jobs:
  sim-test:
    name: Build and run sim smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      USE_CLANG: ${{ matrix.compiler == 'clang' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make libsdl2-dev libsdl2-ttf-dev python3 python3-pip
          if [ "${USE_CLANG}" = "1" ]; then sudo apt-get install -y clang; fi

      - name: Build sim
        run: |
          cd sim
          if [ "${USE_CLANG}" = "1" ]; then make USE_CLANG=1 -j$(nproc); else make -j$(nproc); fi

      - name: Run non-interactive frame test
        run: |
          cd sim
          FRAME_DUMP=build/frame_test.ppm AUTO_EXIT=1 ./sim_voxel

      - name: Compare frame with golden
        run: |
          python3 scripts/check_frame.py sim/tests/golden_frame.ppm sim/build/frame_test.ppm
