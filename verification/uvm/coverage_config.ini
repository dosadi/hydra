# Hydra Coverage Configuration for Open Source Tools
# This file configures coverage collection and analysis using open source tools

# Coverage Collection Settings
COVERAGE_ENABLE=1
COVERAGE_FORMAT=lcov,html,json
COVERAGE_OUTPUT_DIR=coverage_results

# Functional Coverage Groups
AXIL_TRANSACTION_COVERAGE=1
HYDRA_OPERATION_COVERAGE=1
PROTOCOL_COVERAGE=1

# Coverage Goals (percentages)
AXIL_COVERAGE_GOAL=90.0
OPERATION_COVERAGE_GOAL=85.0
TOTAL_COVERAGE_GOAL=88.0

# Coverage Exclusions
# Exclude generated code and testbench files
EXCLUDE_PATTERNS="*_tb.sv,uvm_pkg.sv,testbench.sv"

# Open Source Tool Integration
# LCOV settings for SystemVerilog coverage
LCOV_OPTS="--rc lcov_branch_coverage=1 --rc lcov_function_coverage=1"

# GenHTML settings for HTML reports
GENHTML_OPTS="--branch-coverage --function-coverage --legend"

# Coverage Analysis Tools
# Use these open source tools for comprehensive coverage analysis:
# - LCOV: Line and branch coverage
# - GenHTML: HTML report generation
# - gcov: GCC coverage analysis
# - lcov-cobertura: XML output for CI tools

# CI/CD Integration
# Export coverage metrics to these formats:
# - JSON: For custom dashboards
# - Cobertura XML: For Jenkins/GitLab CI
# - LCOV info: For Coveralls/Codecov

# Coverage Quality Gates
# Tests fail if coverage falls below these thresholds
QUALITY_GATE_AXIL=80.0
QUALITY_GATE_OPERATION=75.0
QUALITY_GATE_TOTAL=78.0